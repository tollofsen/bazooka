<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bazooka — MUD client</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114; --panel: #181a1f; --raised: #202228; --line: #30333b;
      --text: #eff0f3; --muted: #969aa5; --accent: #d5ff72; --danger: #ff8585;
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button {
      border: 1px solid var(--line); border-radius: 7px; padding: 9px 13px;
      background: var(--raised); color: var(--text); cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #171a10; font-weight: 700; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input {
      min-width: 0; border: 1px solid var(--line); border-radius: 7px;
      padding: 9px 11px; background: var(--bg); color: var(--text);
    }
    input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    header {
      height: 68px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .04em; }
    .mark { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px #d5ff7270; }
    .subbrand, .status { color: var(--muted); font-size: 12px; font-weight: 400; }
    .status { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #686b73; }
    .status-dot.online { background: var(--accent); }
    main { height: calc(100dvh - 68px); max-width: 1440px; margin: 0 auto; padding: 28px; }
    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; height: 100%; min-height: 0; }
    .sidebar, .terminal { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .sidebar { min-height: 0; overflow-y: auto; padding: 18px; }
    .section-title { margin: 0 0 14px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .connect-form { display: grid; gap: 9px; }
    .connect-form button { margin-top: 2px; }
    .divider { height: 1px; background: var(--line); margin: 22px 0; }
    .session-list { display: grid; gap: 7px; margin-top: 12px; }
    .session { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-color: transparent; text-align: left; }
    .session.selected { background: #282b31; border-color: #42464f; }
    .session-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-state { color: var(--muted); font-size: 11px; }
    .session-state.online { color: var(--accent); }
    .empty { color: var(--muted); font-size: 12px; }
    .terminal { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .terminal-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .terminal-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .terminal-actions { display: flex; align-items: center; gap: 8px; }
    .terminal-actions button { padding: 6px 10px; font-size: 12px; }
    .output { flex: 1 1 0; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 18px 20px; white-space: pre-wrap; overflow-wrap: anywhere; color: #d8dae0; font-size: 13px; line-height: 1.65; }
    .line-command { color: var(--accent); }
    .line-system { color: #f2c879; font-style: italic; }
    .command-form { display: flex; gap: 10px; padding: 13px; border-top: 1px solid var(--line); }
    .command-form input { flex: 1; }
    .hint { padding: 0 15px 12px; color: var(--muted); font-size: 10px; }
    .toast { position: fixed; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); box-shadow: 0 8px 30px #0008; }
    .toast.error { border-color: #874646; color: var(--danger); }
    @media (max-width: 760px) {
      body { height: auto; min-height: 100dvh; overflow: auto; }
      header { padding: 0 17px; } main { height: auto; min-height: calc(100dvh - 68px); padding: 16px; }
      .layout { grid-template-columns: 1fr; height: auto; min-height: calc(100dvh - 100px); }
      .sidebar { order: 1; overflow: visible; }
      .terminal { height: 55vh; min-height: 320px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark"></span> BAZOOKA <span class="subbrand">/ WEB CLIENT</span></div>
    <div class="status"><span id="status-dot" class="status-dot"></span><span id="connection-status">No session selected</span></div>
  </header>
  <main>
    <div class="layout">
      <aside class="sidebar">
        <h2 class="section-title">Connect to a MUD</h2>
        <form id="connect-form" class="connect-form">
          <input name="host" placeholder="Host, e.g. mud.example.org" autocomplete="url" required>
          <input name="port" type="number" min="1" max="65535" placeholder="Port" required>
          <input name="session_id" placeholder="Session name (optional)">
          <button class="primary" type="submit">Connect</button>
        </form>
        <div class="divider"></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2 class="section-title" style="margin:0">Sessions</h2>
          <button id="refresh" type="button" aria-label="Refresh sessions">Refresh</button>
        </div>
        <div id="sessions" class="session-list"></div>
      </aside>
      <section class="terminal" aria-label="MUD output">
        <div class="terminal-head">
          <div id="terminal-title" class="terminal-title">Select or connect to a session</div>
          <div class="terminal-actions">
            <button id="clear-output" type="button">Clear</button>
            <button id="disconnect" class="danger" type="button" disabled>Disconnect</button>
          </div>
        </div>
        <div id="output" class="output" role="log" aria-live="polite"></div>
        <form id="command-form" class="command-form">
          <input id="command" name="command" placeholder="Enter a command…" autocomplete="off" disabled aria-label="Command">
          <button id="send" class="primary" type="submit" disabled>Send</button>
        </form>
        <div class="hint">Commands are shared with all clients attached to this session.</div>
      </section>
    </div>
  </main>
  <script>
    const sessionsEl = document.querySelector("#sessions");
    const outputEl = document.querySelector("#output");
    const commandEl = document.querySelector("#command");
    const sendEl = document.querySelector("#send");
    const titleEl = document.querySelector("#terminal-title");
    const statusEl = document.querySelector("#connection-status");
    const statusDot = document.querySelector("#status-dot");
    let sessions = [];
    let selected = "";
    let stream;
    let ansiPending = "";
    let ansiState = newAnsiState();
    const history = [];
    let historyIndex = 0;

    function newAnsiState() {
      return { foreground: null, background: null, bold: false, dim: false, italic: false, underline: false, inverse: false, strike: false };
    }
    const ansiColors = [
      "#000000", "#aa0000", "#00aa00", "#aa5500", "#0000aa", "#aa00aa", "#00aaaa", "#aaaaaa",
      "#555555", "#ff5555", "#55ff55", "#ffff55", "#5555ff", "#ff55ff", "#55ffff", "#ffffff"
    ];
    function ansi256Color(index) {
      if (index < 16) return ansiColors[index];
      if (index < 232) {
        const levels = [0, 95, 135, 175, 215, 255];
        const value = index - 16;
        return `rgb(${levels[Math.floor(value / 36)]}, ${levels[Math.floor(value / 6) % 6]}, ${levels[value % 6]})`;
      }
      const gray = 8 + (index - 232) * 10;
      return `rgb(${gray}, ${gray}, ${gray})`;
    }
    function setAnsiColor(state, key, mode, value) {
      if (mode === 5 && value >= 0 && value <= 255) state[key] = ansi256Color(value);
    }
    function applySgr(parameters) {
      const codes = parameters === "" ? [0] : parameters.split(";").map(value => value === "" ? 0 : Number(value));
      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        if (!Number.isInteger(code)) continue;
        if (code === 0) Object.assign(ansiState, newAnsiState());
        else if (code === 1) ansiState.bold = true;
        else if (code === 2) ansiState.dim = true;
        else if (code === 3) ansiState.italic = true;
        else if (code === 4) ansiState.underline = true;
        else if (code === 7) ansiState.inverse = true;
        else if (code === 9) ansiState.strike = true;
        else if (code === 22) { ansiState.bold = false; ansiState.dim = false; }
        else if (code === 23) ansiState.italic = false;
        else if (code === 24) ansiState.underline = false;
        else if (code === 27) ansiState.inverse = false;
        else if (code === 29) ansiState.strike = false;
        else if (code >= 30 && code <= 37) ansiState.foreground = ansiColors[code - 30];
        else if (code === 39) ansiState.foreground = null;
        else if (code >= 40 && code <= 47) ansiState.background = ansiColors[code - 40];
        else if (code === 49) ansiState.background = null;
        else if (code >= 90 && code <= 97) ansiState.foreground = ansiColors[code - 90 + 8];
        else if (code >= 100 && code <= 107) ansiState.background = ansiColors[code - 100 + 8];
        else if (code === 38 || code === 48) {
          const key = code === 38 ? "foreground" : "background";
          const mode = codes[i + 1];
          if (mode === 5 && Number.isInteger(codes[i + 2])) {
            setAnsiColor(ansiState, key, mode, codes[i + 2]);
            i += 2;
          } else if (mode === 2 && [codes[i + 2], codes[i + 3], codes[i + 4]].every(Number.isInteger)) {
            const [red, green, blue] = codes.slice(i + 2, i + 5).map(value => Math.max(0, Math.min(255, value)));
            ansiState[key] = `rgb(${red}, ${green}, ${blue})`;
            i += 4;
          }
        }
      }
    }
    function appendAnsiText(container, chunk) {
      const input = ansiPending + chunk;
      ansiPending = "";
      let text = "";
      let index = 0;
      function flushText() {
        if (!text) return;
        const span = document.createElement("span");
        span.textContent = text;
        const foreground = ansiState.inverse ? (ansiState.background || "#181a1f") : ansiState.foreground;
        const background = ansiState.inverse ? (ansiState.foreground || "#d8dae0") : ansiState.background;
        if (foreground) span.style.color = foreground;
        if (background) span.style.backgroundColor = background;
        if (ansiState.bold) span.style.fontWeight = "bold";
        if (ansiState.dim) span.style.opacity = "0.7";
        if (ansiState.italic) span.style.fontStyle = "italic";
        if (ansiState.underline || ansiState.strike) {
          span.style.textDecoration = [ansiState.underline && "underline", ansiState.strike && "line-through"].filter(Boolean).join(" ");
        }
        container.append(span);
        text = "";
      }
      while (index < input.length) {
        const char = input[index];
        if (char !== "\x1b" && char !== "\x9b") {
          text += char;
          index++;
          continue;
        }
        const csiStart = char === "\x9b" || input[index + 1] === "[";
        if (char === "\x1b" && index + 1 >= input.length) {
          ansiPending = input.slice(index);
          break;
        }
        if (csiStart) {
          const bodyStart = index + (char === "\x9b" ? 1 : 2);
          let end = bodyStart;
          while (end < input.length && (input.charCodeAt(end) < 0x40 || input.charCodeAt(end) > 0x7e)) end++;
          if (end === input.length) {
            if (input.length - index <= 128) ansiPending = input.slice(index);
            break;
          }
          flushText();
          if (input[end] === "m") applySgr(input.slice(bodyStart, end));
          index = end + 1;
          continue;
        }
        flushText();
        if (input[index + 1] === "]") {
          let end = index + 2;
          while (end < input.length && input[end] !== "\x07" && !(input[end] === "\x1b" && input[end + 1] === "\\")) end++;
          if (end === input.length) {
            if (input.length - index <= 128) ansiPending = input.slice(index);
            break;
          }
          index = input[end] === "\x07" ? end + 1 : end + 2;
        } else {
          index += 2;
        }
      }
      flushText();
    }
    function notify(message, error = false) {
      const toast = document.createElement("div");
      toast.className = `toast${error ? " error" : ""}`;
      toast.textContent = message;
      document.body.append(toast);
      setTimeout(() => toast.remove(), 4000);
    }
    async function api(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).error || message; } catch {}
        throw new Error(message);
      }
      if (response.status === 204) return null;
      return response.json();
    }
    function setSelected(id) {
      selected = id;
      if (stream) stream.close();
      stream = null;
      ansiPending = "";
      ansiState = newAnsiState();
      outputEl.replaceChildren();
      commandEl.disabled = !id;
      sendEl.disabled = !id;
      document.querySelector("#disconnect").disabled = !id;
      titleEl.textContent = id ? `Session / ${id}` : "Select or connect to a session";
      const session = sessions.find(item => item.session_id === id);
      statusEl.textContent = id ? (session?.connected ? `Connected · ${session.host}:${session.port}` : "Session disconnected") : "No session selected";
      statusDot.classList.toggle("online", Boolean(session?.connected));
      document.querySelectorAll(".session").forEach(button => button.classList.toggle("selected", button.dataset.id === id));
      if (!id) return;
      const eventStream = new EventSource(`/api/output?session_id=${encodeURIComponent(id)}`);
      stream = eventStream;
      eventStream.addEventListener("output", event => {
        const message = JSON.parse(event.data);
        const line = document.createElement("span");
        line.className = message.kind === 2 ? "line-command" : message.kind === 3 ? "line-system" : "";
        appendAnsiText(line, message.text.replaceAll("\r", ""));
        outputEl.append(line);
        while (outputEl.childNodes.length > 1000) outputEl.firstChild.remove();
        outputEl.scrollTop = outputEl.scrollHeight;
      });
      eventStream.addEventListener("error", event => {
        if (event.data) {
          try { notify(JSON.parse(event.data).error, true); } catch { notify("Output stream failed.", true); }
          eventStream.close();
        }
      });
      eventStream.onerror = () => {
        statusEl.textContent = "Reconnecting to output…";
        statusDot.classList.remove("online");
      };
      eventStream.onopen = () => {
        const active = sessions.find(item => item.session_id === id);
        statusEl.textContent = active?.connected ? `Connected · ${active.host}:${active.port}` : "Session disconnected";
        statusDot.classList.toggle("online", Boolean(active?.connected));
      };
    }
    async function refreshSessions() {
      try {
        const response = await api("/api/sessions");
        sessions = response.sessions || [];
        sessionsEl.replaceChildren();
        if (!sessions.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No active sessions yet.";
          sessionsEl.append(empty);
        }
        for (const session of sessions) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `session${session.session_id === selected ? " selected" : ""}`;
          button.dataset.id = session.session_id;
          const name = document.createElement("span");
          name.className = "session-name";
          name.textContent = session.session_id;
          const state = document.createElement("span");
          state.className = `session-state${session.connected ? " online" : ""}`;
          state.textContent = session.connected ? "ONLINE" : "OFFLINE";
          button.append(name, state);
          button.addEventListener("click", () => setSelected(session.session_id));
          sessionsEl.append(button);
        }
        if (selected && !sessions.some(item => item.session_id === selected)) setSelected("");
        else if (selected) {
          const active = sessions.find(item => item.session_id === selected);
          statusEl.textContent = active.connected
            ? `Connected · ${active.host}:${active.port}`
            : "Session disconnected";
          statusDot.classList.toggle("online", Boolean(active.connected));
        }
      } catch (error) { notify(error.message, true); }
    }
    document.querySelector("#connect-form").addEventListener("submit", async event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      try {
        const result = await api("/api/connect", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({host:data.get("host"), port:Number(data.get("port")), session_id:data.get("session_id")})
        });
        event.currentTarget.reset();
        await refreshSessions();
        setSelected(result.session_id);
      } catch (error) { notify(error.message, true); }
      finally { button.disabled = false; }
    });
    document.querySelector("#command-form").addEventListener("submit", async event => {
      event.preventDefault();
      const command = commandEl.value;
      if (!selected || !command.trim()) return;
      try {
        await api("/api/command", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({session_id:selected, command})
        });
        history.push(command);
        historyIndex = history.length;
        commandEl.value = "";
        commandEl.focus();
      } catch (error) { notify(error.message, true); }
    });
    commandEl.addEventListener("keydown", event => {
      if (event.key === "ArrowUp" && historyIndex > 0) {
        historyIndex--;
        commandEl.value = history[historyIndex];
        event.preventDefault();
      } else if (event.key === "ArrowDown") {
        if (historyIndex < history.length - 1) commandEl.value = history[++historyIndex];
        else { historyIndex = history.length; commandEl.value = ""; }
        event.preventDefault();
      }
    });
    document.querySelector("#disconnect").addEventListener("click", async () => {
      if (!selected || !confirm(`Disconnect session "${selected}"?`)) return;
      try {
        await api("/api/disconnect", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({session_id:selected})
        });
        await refreshSessions();
        notify("Session disconnected.");
      } catch (error) { notify(error.message, true); }
    });
    document.querySelector("#refresh").addEventListener("click", refreshSessions);
    document.querySelector("#clear-output").addEventListener("click", () => outputEl.replaceChildren());
    refreshSessions();
    setInterval(refreshSessions, 10000);
  </script>
</body>
</html>
