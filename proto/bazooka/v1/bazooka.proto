// Bazooka backend API. Shared by the TUI frontend and Python automations.
syntax = "proto3";

package bazooka.v1;

option go_package = "github.com/tollofsen/bazooka/gen/bazookapb";

service Bazooka {
  // Open a TCP connection to a MUD server and create a session.
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // Close a session's MUD connection.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  // Send a command line to the MUD of a session.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // Stream game output (and status events) of a session. Recent scrollback is
  // replayed first when replay_lines > 0.
  rpc StreamOutput(StreamOutputRequest) returns (stream Output);
  // List active sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

message ConnectRequest {
  string host = 1;
  uint32 port = 2;
  // Optional session ID; generated by the server when empty.
  string session_id = 3;
}

message ConnectResponse {
  string session_id = 1;
}

message DisconnectRequest {
  string session_id = 1;
}

message DisconnectResponse {}

message SendCommandRequest {
  string session_id = 1;
  // Command text without trailing newline; the server appends "\r\n".
  string command = 2;
  // Who issued the command (e.g. "tui", "bot:healer"); echoed to other clients.
  string source = 3;
}

message SendCommandResponse {}

message StreamOutputRequest {
  string session_id = 1;
  // Number of scrollback lines to replay before live output.
  uint32 replay_lines = 2;
}

enum OutputKind {
  OUTPUT_KIND_UNSPECIFIED = 0;
  // Text received from the MUD.
  OUTPUT_KIND_GAME = 1;
  // A command sent by a client (echo).
  OUTPUT_KIND_COMMAND = 2;
  // Informational message from Bazooka itself (connect, disconnect, errors).
  OUTPUT_KIND_SYSTEM = 3;
}

message Output {
  string session_id = 1;
  OutputKind kind = 2;
  // Raw text chunk; may be a partial line (e.g. a prompt without newline).
  string text = 3;
  int64 timestamp_unix_ms = 4;
}

message ListSessionsRequest {}

message SessionInfo {
  string session_id = 1;
  string host = 2;
  uint32 port = 3;
  bool connected = 4;
  int64 started_unix_ms = 5;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}
